services:
  db:
    image: postgres:15-alpine
    container_name: b2b-match-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-b2b}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b2b_pass}
      POSTGRES_DB: ${POSTGRES_DB:-b2b_match}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-b2b} -d ${POSTGRES_DB:-b2b_match}"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  backend:
    build: ./backend_max
    container_name: b2b-match-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-b2b}:${POSTGRES_PASSWORD:-b2b_pass}@db:5432/${POSTGRES_DB:-b2b_match}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
      args:
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: b2b-match-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
